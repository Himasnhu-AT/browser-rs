[workspace]
resolver = "2"
members = [
    "crates/browser-core",
    "crates/browser-dom",
    "crates/browser-selectors",
    "crates/browser-xpath",
    "crates/browser-storage",
    "crates/browser-markdown",
    "crates/browser-parser",
    "crates/browser-fingerprint",
    "crates/browser-http",
    "crates/browser-cdp",
    "crates/browser-spider",
    "crates/browser-templates",
    "crates/browser-cli",
    "crates/browser-rs",
    "crates/browser-server",
    "crates/browser-mcp",
]

# Single source of truth for every property shared by the 14 member crates.
# Member manifests must use `<key>.workspace = true` and never repeat a literal.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
license-file = "LICENSE"
repository = "https://github.com/browser-rs/browser-rs"
homepage = "https://github.com/browser-rs/browser-rs"
authors = ["The browser-rs authors"]
keywords = ["scraping", "html", "css-selector", "xpath", "crawler"]
categories = ["web-programming", "parser-implementations"]

# ---------------------------------------------------------------------------
# Single version source. See ARCHITECTURE.md §2 — every third-party crate named
# there is pinned here, and no member crate is allowed to write a version
# literal. Versions were resolved with the MSRV-aware resolver against
# rust-version = 1.97.0.
# ---------------------------------------------------------------------------
[workspace.dependencies]

# --- internal crates -------------------------------------------------------
browser-core = { version = "0.1.0", path = "crates/browser-core" }
browser-dom = { version = "0.1.0", path = "crates/browser-dom" }
browser-selectors = { version = "0.1.0", path = "crates/browser-selectors" }
browser-xpath = { version = "0.1.0", path = "crates/browser-xpath" }
browser-storage = { version = "0.1.0", path = "crates/browser-storage" }
browser-markdown = { version = "0.1.0", path = "crates/browser-markdown" }
browser-parser = { version = "0.1.0", path = "crates/browser-parser" }
browser-fingerprint = { version = "0.1.0", path = "crates/browser-fingerprint" }
browser-http = { version = "0.1.0", path = "crates/browser-http" }
browser-cdp = { version = "0.1.0", path = "crates/browser-cdp" }
browser-spider = { version = "0.1.0", path = "crates/browser-spider" }
browser-templates = { version = "0.1.0", path = "crates/browser-templates" }
browser-rs = { version = "0.1.0", path = "crates/browser-rs", default-features = false }
browser-server = { version = "0.1.0", path = "crates/browser-server" }
browser-mcp = { version = "0.1.0", path = "crates/browser-mcp" }

# --- HTML tree (§1.2) ------------------------------------------------------
html5ever = "0.39.0"
markup5ever = "0.39.0"
tendril = "0.5.1"
ego-tree = "0.11.0"

# --- CSS selection (§1.3) --------------------------------------------------
selectors = "0.40.0"
cssparser = "0.37.0"

# --- regular expressions (§1.1) --------------------------------------------
regex = "1.13.1"
fancy-regex = "0.19.0"

# --- serialisation ---------------------------------------------------------
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# --- ordered / concurrent containers ---------------------------------------
indexmap = "2.14.0"
dashmap = "6.2.1"
bitflags = "2.13.1"
parking_lot = "0.12.5"

# --- storage (§1.5) --------------------------------------------------------
rusqlite = { version = "0.40.2", features = ["bundled"] }
psl = "2.1.226"

# --- URLs (§2.1) -----------------------------------------------------------
url = "2.5.8"
percent-encoding = "2.3.2"
form_urlencoded = "1.2.2"
idna = "1.1.0"

# --- HTTP transport (§2.3) -------------------------------------------------
# NOTE: ARCHITECTURE.md §2 names wreq 0.16.0 / wreq-util 0.2.0; those require
# rustc 1.98. Pinned one minor back so the workspace resolves on 1.97.0.
wreq = "0.15.3"
wreq-util = "0.1.0"
http = "1.5.0"
bytes = "1.12.1"
mime = "0.3.17"
encoding_rs = "0.8.35"
cookie = "0.18.2"
httpdate = "1.0.3"

# --- async runtime ---------------------------------------------------------
tokio = "1.53.1"
tokio-util = "0.7.19"
futures = "0.3.34"
async-trait = "0.1.92"
async-stream = "0.3.6"

# --- headless browser (§2.3) -----------------------------------------------
# NOTE: do NOT enable chromiumoxide's `rustls`/`native-tls` features here. They
# expand to `chromiumoxide_fetcher/<tls>`, which force-enables that optional crate
# without granting it a zip backend, and it then fails to compile under
# `--no-default-features`. We only need the CDP client; `browser-cli` depends on
# `chromiumoxide_fetcher` directly, with its own defaults, for `brs install`.
chromiumoxide = "0.9.1"
chromiumoxide_fetcher = "0.9.1"

# --- parallelism -----------------------------------------------------------
rayon = "1.12.0"

# --- errors & logging ------------------------------------------------------
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# --- hashing & encoding ----------------------------------------------------
sha1 = "0.11.0"
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.23.1"
phf = { version = "0.14.0", features = ["macros"] }
phf_codegen = "0.14.0"

# --- feeds, archives, robots (§1.12, §2.2) ---------------------------------
quick-xml = "0.42.0"
csv = "1.4.0"
flate2 = "1.1.9"
# `texting_robots` was dropped in wave 6: unit 16 ported protego from scratch
# (166,839 differential assertions) and unit 17 removed the last reference, so
# the declaration had been dangling since then.

# --- time ------------------------------------------------------------------
chrono = "0.4.45"

# --- CLI (§1.13) -----------------------------------------------------------
clap = { version = "4.6.6", features = ["derive"] }
# `shlex` was dropped in wave 6: `browser-cli`'s `uncurl` carries a
# transcription of CPython's `shlex.read_token` instead, because the crate treats
# `#` as a comment introducer and `\r` as non-whitespace where Python does not
# (274 disagreements in 12,000 fuzzed command lines).
tempfile = "3.27.0"

# --- misc ------------------------------------------------------------------
rand = "0.10.2"

# --- dev-only (unit 20) ----------------------------------------------------
# ⚠️ `criterion` is **not in `Cargo.lock`** and crates.io is not reachable from
# this environment, so `cargo bench` cannot be wired up until someone runs
# `cargo add --dev criterion -p browser-rs` on a machine with a network. The
# declaration is kept because unit 20's benches (`parse`, `relocate`,
# `markdown`) are still owed; it is not a dependency of anything today.
criterion = "0.8.2"
# `wiremock` was dropped in wave 6, closing housekeeping item 8. It was never in
# `Cargo.lock` either, and the workspace now has six hand-rolled `std::net` /
# `tokio` loopback fixtures that do the job without a network to fetch it from.
# `crates/browser-rs/tests/integration.rs::local_site::Site` is the one to copy.

# --- the server layer (wave 7) ---------------------------------------------
# `brs-serve` hosts the REST API, the MCP HTTP transport and the live dashboard
# on one port. All four were probe-compiled against rust-version = 1.97.0
# before being pinned here; axum 0.9 and rmcp 3.x both want a newer toolchain.
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower-http = { version = "0.6.11", features = ["cors", "trace", "limit", "timeout"] }
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
tokio-tungstenite = "0.28.0"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "unwind"
strip = "debuginfo"

[profile.bench]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
