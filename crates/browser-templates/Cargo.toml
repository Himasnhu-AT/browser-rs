[package]
name = "browser-templates"
description = "Ready-made spiders for browser-rs: link extraction, crawl rules, sitemaps, Shopify, feeds and site-to-markdown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
browser-core.workspace = true
browser-parser.workspace = true
browser-spider.workspace = true

browser-markdown = { workspace = true, optional = true }

async-stream.workspace = true
async-trait.workspace = true
csv.workspace = true
flate2.workspace = true
futures.workspace = true
indexmap.workspace = true
quick-xml.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tracing.workspace = true
url.workspace = true

[features]
default = []
markdown = ["dep:browser-markdown", "browser-parser/markdown"]
browser = ["browser-spider/browser"]
adaptive = ["browser-spider/adaptive"]
