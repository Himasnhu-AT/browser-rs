[package]
name = "browser-rs"
description = "An undetectable, adaptive web-scraping library for Rust — the Rust port of the reference implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
browser-core.workspace = true

browser-cdp = { workspace = true, optional = true }
browser-http = { workspace = true, optional = true }
browser-parser = { workspace = true, optional = true }
browser-spider = { workspace = true, optional = true }
browser-templates = { workspace = true, optional = true }

thiserror.workspace = true

# The seam tests in `tests/integration.rs` reach past the façade on purpose: they
# assert that the member crates unit 12 and unit 14 are about to be built on top
# of actually compose with one another. They are dev-only; nothing in `src/`
# depends on them.
#
# `browser-parser` is listed again here with `adaptive` on so the adaptive
# round trip runs under a plain `cargo test --workspace`, without the caller
# having to remember `--features adaptive`. It does not change the façade's own
# feature surface: `browser-rs`'s `#[cfg(feature = "adaptive")]` stays off.
[dev-dependencies]
browser-dom.workspace = true
browser-selectors.workspace = true
browser-xpath.workspace = true
browser-storage.workspace = true
browser-http.workspace = true
browser-parser = { workspace = true, features = ["adaptive"] }
browser-spider.workspace = true
async-trait.workspace = true
bytes.workspace = true
indexmap.workspace = true
regex.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# Wave 4's seam tests drive a real `AsyncFetcherSession` against a loopback
# server started by the test itself. No `wiremock`: it is not in `Cargo.lock`
# and the open internet is not reachable here, so the fixture is ~90 lines of
# `std::net` on a scratch thread — the same shape `browser-http`'s own
# `tests/u12_support` uses.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }

[features]
default = ["http", "parser"]
parser = ["dep:browser-parser"]
http = ["dep:browser-http", "parser"]
browser = ["dep:browser-cdp", "http"]
spider = ["dep:browser-spider", "dep:browser-templates", "http"]
markdown = ["browser-parser/markdown"]
adaptive = ["browser-parser/adaptive"]
blocking = ["browser-http/blocking"]
full = ["browser", "spider", "markdown", "adaptive", "blocking"]

[lints.rust]
# `docsrs` is set only by docs.rs; teach the `unexpected_cfgs` lint about it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
