<!doctype html>
<html>
<head><title>SVG</title></head>
<body>
<div id="chart" class="figure">
  <svg id="s1" class="icon chart" width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <title class="svgtitle">Chart</title>
    <defs><linearGradient id="grad" class="grad"><stop class="stop" offset="0%"/><stop class="stop" offset="100%"/></linearGradient></defs>
    <g class="layer" id="g1">
      <rect class="bar" x="0" y="0" width="10" height="50"/>
      <rect class="bar hot" x="20" y="0" width="10" height="80"/>
      <circle class="dot" cx="50" cy="50" r="5"/>
      <text class="label" x="5" y="95">hi</text>
    </g>
    <a class="svglink" href="/svg-target">link</a>
  </svg>
</div>
<div id="math" class="figure">
  <math class="mathml"><mi class="mi">x</mi><mo class="mo">+</mo><mn class="mn">1</mn></math>
</div>
<p class="after">after the svg</p>
</body>
</html>
