[package]
name = "browser-cdp"
description = "Headless-Chromium fetchers for browser-rs, driven over raw CDP with a hand-rolled networkidle and Cloudflare solver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
browser-core.workspace = true
browser-fingerprint.workspace = true
browser-http.workspace = true

async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chromiumoxide.workspace = true
futures.workspace = true
http.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "fs", "process"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# Test-only: the unit-14 live corpus runs a tokio fixture server (`net`,
# `io-util`) and fans several live browsers out across worker threads
# (`rt-multi-thread`). Cargo unifies these with the `[dependencies]` entry
# above when building tests, and they are not compiled for consumers.
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread"] }

[features]
default = []
# `Response::markdown()` on a browser-driven response. The method lives on unit
# 12's `Response` — the only response type in the workspace — so the flag has to
# reach `browser-http`, not `browser-parser`.
markdown = ["browser-http/markdown"]
adaptive = ["browser-http/adaptive"]
