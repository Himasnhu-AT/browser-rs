[package]
name = "browser-server"
description = "The browser-rs server: a REST API, an MCP transport and a live browser dashboard on one port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "brs-serve"
path = "src/bin/serve.rs"

[dependencies]
browser-rs = { workspace = true, features = ["full"] }
browser-cdp.workspace = true
browser-http.workspace = true
browser-parser = { workspace = true, features = ["markdown", "adaptive"] }
browser-spider.workspace = true
browser-templates.workspace = true
browser-core.workspace = true
browser-fingerprint.workspace = true

axum.workspace = true
tower-http.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
url.workspace = true
uuid.workspace = true
base64.workspace = true
bytes.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true
tempfile.workspace = true
