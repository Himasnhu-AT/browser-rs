<!DOCTYPE html>
<html>
<head><title>Links</title></head>
<body>
    <nav id="main-nav">
        <a href="/one" rel="next" class="nav">One</a>
        <a href="/two" class="nav">Two</a>
        <a href="https://example.com/three">Three</a>
        <a name="anchor-only">No href</a>
        <a href="">Empty</a>
    </nav>
    <div id="content">
        <p>Body text with <a href="/inline" title="inline link">an inline link</a> inside.</p>
        <map name="m">
            <area href="/area-one" shape="rect" coords="0,0,1,1">
            <area href="/area-two" shape="rect" coords="1,1,2,2">
        </map>
        <img src="/img.png" alt="An image">
    </div>
    <footer id="foot">
        <a href="/foot-one">Foot one</a>
        <a href="/foot-two">Foot two</a>
    </footer>
</body>
</html>
